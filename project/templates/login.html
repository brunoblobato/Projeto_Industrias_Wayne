{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <h3 class="login-title">Login</h3>
    <div class="login-box">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="notification is-danger">
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}
        <form method="POST" action="/login">
            <div class="field">
                <div class="control">
                    <input class="custom-input" type="email" name="email" placeholder="Seu E-mail" autofocus="">
                </div>
            </div>

            <div class="field">
                <div class="control">
                    <input class="custom-input" type="password" name="password" placeholder="Sua Senha">
                </div>
            </div>

            <div class="remember-field">
                <label class="checkbox custom-checkbox">
                    <input type="checkbox">
                    Lembrar-me
                </label>
            </div>

            <button class="custom-button">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
