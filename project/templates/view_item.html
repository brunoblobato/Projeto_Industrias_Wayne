{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Detalhes do Item</h2>
    
    <!-- Exibindo as informações do item -->
    <div class="card" style="width: 18rem;">
        {% if item.image_url %}
        <img src="{{ url_for('static', filename=item.image_url) }}" class="card-img-top" alt="{{ item.name }}">
        {% else %}
        <img src="{{ url_for('static', filename='images/default.jpg') }}" class="card-img-top" alt="Imagem do item">
        {% endif %}
        <div class="card-body">
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="card-text"><strong>Descrição:</strong> {{ item.description }}</p>
            <p class="card-text"><strong>Categoria:</strong> {{ item.category }}</p>
            <p class="card-text"><strong>Quantidade:</strong> {{ item.quantity }}</p>
        </div>
    </div>

    <!-- Botões de ação -->
    <div class="mt-3">
        <a href="{{ url_for('items.edit_item', item_id=item.id) }}" class="btn btn-warning">Editar</a>
        <form action="{{ url_for('items.delete_item', item_id=item.id) }}" method="POST" class="d-inline">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja excluir este item?');">Excluir</button>
        </form>
        <a href="{{ url_for('items.manage_items') }}" class="btn btn-secondary">Voltar</a>
    </div>
</div>
{% endblock %}
