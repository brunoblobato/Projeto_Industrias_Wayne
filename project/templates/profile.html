{% extends "base.html" %}

{% block content %}
<h1 class="title">
  Welcome, {{ name }}!
</h1>
{% if current_user.is_authenticated %}
<a href="{{ url_for('items.manage_items') }}" class="button is-primary">Gerenciar Itens</a>
{% endif %}
{% if current_user.is_authenticated and current_user.role == 'admin' %}
<a href="{{ url_for('users.list_users') }}">Gestão de Usuários</a>
{% endif %}
{% endblock %}
